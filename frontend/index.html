<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Quy chế Đào tạo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .chat-container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 80vh;
        }
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .chat-header h1 { font-size: 1.5rem; margin-bottom: 5px; }
        .chat-header p { font-size: 0.9rem; opacity: 0.9; }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: #667eea;
            color: white;
            border-bottom-right-radius: 5px;
        }
        .message.bot {
            align-self: flex-start;
            background: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 5px;
        }
        .message.bot .sources {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #666;
            border-top: 1px solid #ddd;
            padding-top: 8px;
        }
        .chat-input {
            display: flex;
            padding: 15px;
            border-top: 1px solid #eee;
            gap: 10px;
        }
        .chat-input input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #eee;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
        }
        .chat-input input:focus { border-color: #667eea; }
        .chat-input button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
        }
        .chat-input button:disabled { opacity: 0.6; }
        .typing { display: flex; gap: 5px; padding: 12px 18px; }
        .typing span {
            width: 8px; height: 8px;
            background: #999;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

                /* Định dạng Markdown trong tin nhắn bot */
        .message.bot h1,
        .message.bot h2,
        .message.bot h3 {
            margin: 10px 0 6px 0;
            font-size: 1.05rem;
            color: #333;
        }
        .message.bot ul,
        .message.bot ol {
            margin: 6px 0;
            padding-left: 20px;
        }
        .message.bot li {
            margin: 4px 0;
            line-height: 1.6;
        }
        .message.bot strong {
            color: #4a3f8a;
            font-weight: 600;
        }
        .message.bot p {
            margin: 8px 0;
        }
        .message.bot code {
            background: #e8e8e8;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🎓 Chatbot Quy chế Đào tạo</h1>
            <p>Tra cứu thông tin quy chế đào tạo bằng AI</p>
        </div>
        <div class="chat-messages" id="messages">
            <div class="message bot">
                Xin chào! Tôi là trợ lý ảo chuyên về quy chế đào tạo.
                Bạn có thể hỏi tôi về điều kiện tốt nghiệp, quy định thi cử, chuẩn đầu ra, v.v.
            </div>
        </div>
        <div class="chat-input">
            <input type="text" id="questionInput" placeholder="Nhập câu hỏi của bạn..."
                   onkeypress="if(event.key==='Enter') sendQuestion()">
            <button id="sendBtn" onclick="sendQuestion()">Gửi</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        const API_URL = 'https://rag-chatbot-backend-veae.onrender.com';

        const messagesDiv = document.getElementById('messages');
        const input = document.getElementById('questionInput');
        const sendBtn = document.getElementById('sendBtn');

        function addMessage(text, type, sources = []) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            if (type === 'bot') {
                div.innerHTML = marked.parse(text);
            } else {
                div.textContent = text;
            }
                        
            if (sources && sources.length > 0) {
                const sourcesDiv = document.createElement('div');
                sourcesDiv.className = 'sources';
                sourcesDiv.innerHTML = '<strong>📚 Nguồn tham khảo:</strong><br>' +
                    sources.slice(0, 3).map(s =>
                        `• ${s.source || 'Tài liệu'} (điểm liên quan: ${s.score.toFixed(3)})`
                    ).join('<br>');
                div.appendChild(sourcesDiv);
            }
            
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'message bot typing';
            div.id = 'typingIndicator';
            div.innerHTML = '<span></span><span></span><span></span>';
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function hideTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        async function sendQuestion() {
            const question = input.value.trim();
            if (!question) return;

            addMessage(question, 'user');
            input.value = '';
            input.disabled = true;
            sendBtn.disabled = true;
            showTyping();

            try {
                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question }),
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Lỗi server');
                }

                const data = await response.json();
                hideTyping();
                addMessage(data.answer, 'bot', data.sources);
            } catch (error) {
                hideTyping();
                addMessage(`❌ Lỗi: ${error.message}`, 'bot');
            } finally {
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
            }
        }
    </script>
</body>
</html>
